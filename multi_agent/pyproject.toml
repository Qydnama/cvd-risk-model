[project]
name = "cvd-agents"
version = "0.1.0"
description = "Research-only multi-agent interface to the locked minimal_v1 model"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cvd-risk-model",
  "deepagents>=0.3,<1",
  "langchain-openai>=1,<2",
  "pydantic>=2,<3",
  "joblib==1.5.3",
  "numpy==2.5.1",
  "pandas==2.3.3",
  "scikit-learn==1.9.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv.sources]
cvd-risk-model = { path = "..", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvd_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
