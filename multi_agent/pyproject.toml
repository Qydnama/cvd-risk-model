[project]
name = "cvd-agents"
version = "0.2.0"
description = "Research-only multi-agent interface to the locked minimal_v1 model"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cvd-risk-model",
  "langchain>=1.4,<2",
  "langchain-core>=1.6,<2",
  "langgraph>=1.2,<2",
  "langchain-openai>=1,<2",
  "langchain-anthropic>=1.7,<2",
  "pydantic>=2,<3",
  "joblib==1.5.3",
  "numpy==2.5.1",
  "pandas==2.3.3",
  "scikit-learn==1.9.0",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.uv.sources]
cvd-risk-model = { path = "..", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvd_agents"]

[project.scripts]
cvd-agents = "cvd_agents.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: requires a real LLM API key (AGENT_MODEL and provider key in the environment)"]
