[project]
name = "cvd-risk-model"
version = "0.1.0"
description = "Reproducible NHIS/NHANES pipeline for five-year cardiovascular mortality risk research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<24",
    "pyyaml>=6.0.2,<7",
    "requests>=2.32,<3",
    "tabulate>=0.9,<1",
]

[project.optional-dependencies]
modeling = [
    "joblib>=1.4,<2",
    "scikit-learn>=1.6,<2",
    "xgboost>=3,<4",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pandas-stubs>=2.2,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvd_risk"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cvd_risk"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
