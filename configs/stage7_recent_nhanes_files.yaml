schema_version: 1
verified_on: "2026-07-16"

# Stage 7 uses a separate inventory so the immutable 1999-2014 external-
# validation inventory and its model-lock SHA remain unchanged. Only files
# needed for the frozen minimal route and the linked mortality outcome are
# included.
allowed_hosts:
  - wwwn.cdc.gov
  - ftp.cdc.gov

official_sources:
  nhanes_cycle_catalog: https://wwwn.cdc.gov/nchs/nhanes/continuousnhanes/default.aspx
  linked_mortality_catalog: https://ftp.cdc.gov/pub/health_statistics/NCHS/datalinkage/linked_mortality/

cycles:
  "2015-2016":
    start_year: 2015
    end_year: 2016
    suffix: _I
    files:
      - component: DEMO
        tier: fast
        format: xpt
        filename: DEMO_I.xpt
        url: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2015/DataFiles/DEMO_I.xpt
      - component: BMX
        tier: fast
        format: xpt
        filename: BMX_I.xpt
        url: https://wwwn.cdc.gov/Nchs/Data/Nhanes/Public/2015/DataFiles/BMX_I.xpt
      - component: SMQ
