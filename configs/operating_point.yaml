schema_version: 1
stage: stage5b_prelock_operating_point_audit

selected_model_config: configs/final_model_selection.yaml
stage4_manifest: artifacts/stage4_baselines/manifest.json
stage5_manifest: artifacts/stage5_ml_candidates/manifest.json
stage5a_manifest: artifacts/stage5a_planning/manifest.json
stop_gate: reports/stop_gate.json
protocol_discrepancies: configs/protocol_discrepancies.yaml
experiment_config: configs/experiment.yaml
cohort: data/processed/nhis_cohort.parquet

prediction_column: prediction_sigmoid
secondary_screening_operating_point:
  approved_by_user_on: "2026-07-15"
  target_survey_weighted_sensitivity: 0.80
  selection_rule: maximum_development_oof_cutoff_with_sensitivity_at_least_target
  classification_rule: predicted_risk_greater_than_or_equal_to_cutoff
  approved_reference_cutoff: 0.007469
  approved_reference_rounding_decimals: 6
  role: secondary_screening_operating_point
  primary_model_output: continuous_five_year_risk
  interpretation: not_a_diagnosis_or_clinically_endorsed_high_risk_boundary

cluster_bootstrap:
  method: stratified_psu_with_replacement_within_strata
  repetitions: 2000
  seed: 20260714
  confidence_level: 0.95
  interval_method: percentile
  reselect_cutoff_in_each_replicate: false

dca:
  threshold: fixed_secondary_screening_cutoff
  comparators: [treat_all, treat_none]

calibration_comparison:
  evidence_commit: b92f9210563f3d10ac204a527dc5bac5f703d402
  evidence_table: reports/tables/stage4_model_comparison.csv
  model: LogisticRegression
  weighting: survey_weighted
  comparator: none
  selected: sigmoid
  numerical_tie_absolute_tolerance: 1.0e-6
  paired_cluster_bootstrap_repetitions: 2000
  seed: 20260714
  confidence_level: 0.95
  require_brier_not_worse: true
  require_log_loss_improved_or_numerical_tie: true
  require_calibration_intercept_and_slope_improved: true

outputs:
  artifact_dir: artifacts/stage5b_operating_point
  report: reports/stage5b_operating_point_report.md
  metrics: reports/tables/stage5b_operating_metrics.csv
  confusion_per_10000: reports/tables/stage5b_weighted_confusion_per_10000.csv
  fold_stability: reports/tables/stage5b_stability_by_fold.csv
  year_stability: reports/tables/stage5b_stability_by_year.csv
  dca: reports/tables/stage5b_dca_at_cutoff.csv
  lineage: reports/tables/stage5b_chf_lineage.csv
  calibration_comparison: reports/tables/stage5b_calibration_comparison.csv
