schema_version: 1
verified_on: "2026-07-14"

# These are the exact public links exposed by the official CDC/NCHS cycle
# catalogs.  Do not derive legacy laboratory names from the cycle suffix:
# 1999-2004 use LAB13/L13_* and LAB10/L10_* rather than TCHOL/HDL/GHB.
allowed_hosts:
  - wwwn.cdc.gov
  - ftp.cdc.gov

official_sources:
  nhanes_cycle_catalog: https://wwwn.cdc.gov/nchs/nhanes/continuousnhanes/default.aspx
  linked_mortality_catalog: https://ftp.cdc.gov/pub/health_statistics/NCHS/datalinkage/linked_mortality/
  linked_mortality_read_program: https://ftp.cdc.gov/pub/Health_statistics/NCHS/datalinkage/linked_mortality/R_ReadInProgramAllSurveys.R
  linked_mortality_dictionary: https://www.cdc.gov/nchs/data/datalinkage/public-use-linked-mortality-files-data-dictionary.pdf

