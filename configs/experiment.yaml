schema_version: 2

experiment:
  name: cvd_mortality_5y_v2_4
  protocol_version: "2.4"
  protocol_fixed_on: "2026-07-14"
  protocol_sha256: c57ab77c2f36f30f9180c1595c30dedf1ac9a9919f7f810511c888d6348a28ce
  random_seed: 20260714

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  date_format: "%Y-%m-%dT%H:%M:%S%z"

paths:
  nhis_raw_dir: data/raw/nhis
  nhanes_raw_dir: data/raw/nhanes
  interim_dir: data/interim
  processed_dir: data/processed
  report_tables_dir: reports/tables
  report_figures_dir: reports/figures
  artifacts_dir: artifacts
  quarantine_dir: artifacts/quarantine
  quarantine_manifest: artifacts/audit/quarantine_manifest.json
  stage0_status: artifacts/audit/stage0_status.json
  data_manifest: configs/data_manifest.yaml
  protocol_discrepancies: configs/protocol_discrepancies.yaml

statistical_backend:
  reference: R
  python_role: [data_engineering, machine_learning, api, website]
  r_packages:
    survey: "4.5"
    pmsampsize: "1.1.3"
    pmvalsampsize: "0.1.0"
  r_version_source: .R-version
  renv_lock: renv.lock
  missing_rscript_status: BLOCKED_RSCRIPT_NOT_FOUND
  python_portability_tolerances:
    absolute_proportion_se_ci: 1.0e-10
    relative_deff_ess: 1.0e-8
    required_sample_size_integer_match: true

cohort:
  age_min: 40
  age_max: 79
  mortality_followup_end: "2019-12-31"
  require_mortality_linkage_eligibility: true
  require_known_outcome: true
  exclude_prevalent_cvd: true
  prevalent_cvd_conditions:
    - coronary_heart_disease
    - angina_pectoris
    - myocardial_infarction
    - stroke
  sensitivity_prevalent_cvd_conditions:
    - coronary_heart_disease
    - angina_pectoris
    - myocardial_infarction
    - stroke
    - congestive_heart_failure
  nhis_chf_sensitivity_years: [1999, 2002]

outcome:
  name: cvd_death_5y
  horizon_months: 60
  cardiovascular_ucod_leading:
    - "001"
    - "005"
  nhanes_followup_field: PERMTH_INT
  nhanes_max_followup_months_inclusive: 60
  nhis_max_followup_quarters_inclusive: 19
  nhis_ambiguous_boundary_quarter: 20
  nhis_include_boundary_in_primary_analysis: false
  reject_negative_followup: true

splits:
  nhis_development:
    start_year: 1997
    end_year: 2009
  nhis_temporal_test:
    start_year: 2010
    end_year: 2014
  nhanes_external_validation:
    start_year: 1999
    end_year: 2014

survey_design:
  variance_estimator: taylor_linearization
  lonely_psu:
    primary: adjust
    domain_adjust: true
    sensitivity: average
  minimum_design_df: 8
  variance_tolerance_multiplier: 1.0e-12
  nhis:
    weight: MORTWTSA
    strata: STRATA
    psu: PSU
    identifiers_are_ipums_integrated: true
    forbid_year_interaction: true
    pooled_weight_divisor:
      development: 13
      temporal_test: 5
  nhanes:
    strata: SDMVSTRA
    psu: SDMVPSU
    identifiers_are_published: true
    collision_audit_required: true
    automatic_cycle_interaction_forbidden: true
    pooled_weight_rules:
      external_1999_2002:
        cycles: [1999-2000, 2001-2002]
        source: WTMEC4YR
        divisor: 4
        estimand: nhanes_external_validation_1999_2014
      external_2003_2014:
        cycles: [2003-2004, 2005-2006, 2007-2008, 2009-2010, 2011-2012, 2013-2014]
        source: WTMEC2YR
        divisor: 8
        estimand: nhanes_external_validation_1999_2014
      recent_2015_2018:
        cycles: [2015-2016, 2017-2018]
        source: WTMEC2YR
        divisor: 2
        estimand: nhanes_recent_censored_2015_2018

audit:
  race_ethnicity:
    enabled: true
    role: audit_only
    require_codebook_validation: true
    skip_unreliable_groups: true
    minimum_events_per_group: 20
    minimum_non_events_per_group: 20

stop_gate:
  minimum_events:
    nhis_minimal_development: 500
    nhis_minimal_no_general_health_development: 500
    nhanes_clinical_core_development: 200
    nhanes_clinical_hba1c_paired_development: 200
    nhis_temporal_test: 200
    nhanes_external_validation: 100
  minimum_design_df: 8
  risk_ci_max_half_width: 0.0025
  pmsampsize:
    expected_r2_fraction_of_max: 0.15
    parameters: 15
    shrinkage: 0.90
  preliminary_logistic_effective_df: 20
  minimum_events_per_effective_df: 20
  action_on_failure: feasibility_report_and_stop
  # These values are protocol decisions. Change them only before evaluating test performance.
  protocol_locked_before_test_evaluation: true

missing_data:
  minimal:
    primary: within_training_fold_imputation
    complete_case: sensitivity_only
  clinical_core:
    required_fields: [sbp_mean, total_cholesterol, hdl_cholesterol]
    primary: complete_case
    multiple_imputation: sensitivity_only
  clinical_hba1c:
    required_fields: [sbp_mean, total_cholesterol, hdl_cholesterol, hba1c]
    primary: paired_complete_case
    multiple_imputation: sensitivity_only
    export_if_only_imputed_passes: false

reproducibility:
  deterministic_algorithms: true
  preserve_raw_data: true
  overwrite_outputs: false
